[project]
name = "busybar"
version = "0.1.0"
description = "Integrations for the BUSY Bar local HTTP API"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyobjc-framework-EventKit>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
discovery = ["zeroconf>=0.147"]

[dependency-groups]
dev = ["pytest>=8.3", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busybar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Belt-and-braces: import busybar from src/ even if the venv's editable
# .pth is unusable (macOS UF_HIDDEN on .pth files makes site skip them).
pythonpath = ["src"]
