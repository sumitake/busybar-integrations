# Copy to config.toml (git-ignored) and edit. All keys optional; defaults shown.

[device]
host = "10.0.4.20"          # USB-Ethernet default; set your LAN IP for Wi-Fi

# Cloud transport fallback (v1.6, optional). When cloud_token is set,
# BusyBarClient automatically falls back to BUSY's cloud relay if the
# local device becomes unreachable (USB unplugged, Wi-Fi drop, etc.), and
# recovers back to local automatically once the device is reachable
# again. Leave cloud_token empty (the default) to disable cloud fallback
# entirely -- behavior is then identical to pre-v1.6.
#
# Mint a token at https://cloud.busy.app -> "API tokens" tab -> create a
# token with the "BUSY Bar" scope (full device control, tied to exactly
# one linked device -- no separate device id needed here). Revoking a
# token from the dashboard takes effect immediately and cannot be undone;
# create the replacement token first if you're rotating.
#
# The real token belongs ONLY in your git-ignored config.toml -- never
# here, and never committed anywhere. See README.md's "Cloud transport"
# section for the full walkthrough.
cloud_token = ""
cloud_base_url = "https://api.busy.app/busybar"
transport = "auto"          # "auto" (local, fall back to cloud) | "local" | "cloud" (forced --
                              # mainly for deliberately testing the cloud path)

[calendar_countdown]
poll_seconds = 10            # ambient-tier redraw cadence (default: 10) -- matches the running-CI
                              # overlay's 10s dwell gap so this app's redraws reliably land inside
                              # it for near-true alternation (see busybar/display.py)
lookahead_hours = 12
warn_minutes = 5             # bar/countdown turn red within N minutes of start
notice_minutes = 15          # bar/countdown turn amber within N minutes of start
progress_window_minutes = 60 # progress bar drains from full over this many minutes
include_all_day = false
auto_busy = false
# calendars = ["Work"]      # omit to read all calendars

# v1.5.2 escalation ladder -- as an upcoming event gets closer, the calendar
# climbs busybar/display.py's shared priority ladder so it can no longer be
# silently buried by ci_status's overlay-tier rotation (running badge, quota
# frames, and -- as of v1.7 -- CI failure/stuck frames too, since those now
# share the same PRIORITY_OVERLAY tier instead of a separate alert tier).
# See calendar_countdown/README.md's "Escalation ladder" section before
# tuning. ASSUMED ORDERING (logged as a
# one-time startup warning if violated -- see check_threshold_ordering):
# approach_minutes > notice_minutes > warn_minutes >= imminent_minutes.
approach_minutes = 30        # inside this (outside notice_minutes): priority rises above the
                              # overlay tier (PRIORITY_AMBIENT_RAISED) -- normal palette, unchanged
imminent_minutes = 1         # inside this (and not yet started): LED blinks on every draw
chirp = true                 # one-time audio chirp exactly at event start (T-0); false disables audio
escalation_icons = true      # animated calendar icons at the 5-min / 1-min stages
start_animation = "meeting_72x16"  # full-panel takeover for the first minute after an event starts; "" disables
start_window_seconds = 60    # how long that takeover holds

[ci_status]
poll_seconds = 120
repos = ["your-user/your-repo"]
show_green = false
# stale_queued_minutes = 15  # omit to disable stuck-queue detection
show_running = true          # show a badge (alternating with the calendar) while a run is in progress
running_poll_seconds = 20    # poll interval while a run is active (shortened from poll_seconds)
show_quota = true            # GraphQL/REST quota frames join the overlay rotation while a run
                              # is active (no effect if show_running is false)
running_spinner = true       # animated 8x8 spinner on the running badge

# Account-wide watching (v1.5.1) -- off by default. When on, the watch list
# becomes auto-discovered account repos UNION `repos` above, MINUS
# repos_exclude below. See ci_status/README.md's "Account-wide watching"
# section for quota math and the active-window caveat before enabling.
watch_account_repos = false
# repos_exclude = ["your-user/archived-experiment"]  # silence specific repos without leaving account mode
active_within_days = 30      # only repos pushed within this window are polled
repo_refresh_minutes = 60    # how often the repo list itself is re-enumerated (new repos picked up within this interval)

[nyan_filler]
enabled = true                # set false to disable the animation without uninstalling the agent
poll_seconds = 1              # how quickly a dark gap is reclaimed (the draw is tiny; see README)
quiet_hours = "00:00-07:00"   # local time; "" disables quiet hours entirely
